<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portofolio | Web</title>
    <style>
      /* --- RESET & BASE STYLES --- */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #eff1f2;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #333;
        line-height: 1.6;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      ul {
        list-style: none;
      }

      /* --- LAYOUT GRID --- */
      .container {
        display: grid;
        grid-template-areas: 'sidebar' 'content' 'footer';
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
        min-height: 100vh;
        width: 100%;
      }

      /* --- SIDEBAR --- */
      .sidebar {
        grid-area: sidebar;
        background: linear-gradient(160deg, #c86b8e 0%, #da69fa 50%, #6e7dfd 100%);
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }

      .sidebar nav ul {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .sidebar nav ul li a {
        color: rgba(255, 255, 255, 0.8);
        font-weight: 600;
        font-size: 1.1rem;
        transition: all 0.3s ease;
        padding: 5px 10px;
        border-radius: 5px;
      }

      .sidebar nav ul li a:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
      }

      /* --- MAIN CONTENT --- */
      .content {
        grid-area: content;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 3rem 1rem;
      }

      .hero {
        max-width: 800px;
        width: 100%;
        text-align: center;
        background: #fff;
        padding: 3rem;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      }

      .hero img {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 1.5rem;
        border: 4px solid #fff;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      }

      .hero-content h1 {
        font-size: 2.5rem;
        color: #2d3436;
        margin-bottom: 0.5rem;
      }

      .hero-content h2 {
        font-size: 1.2rem;
        color: #6c5ce7;
        margin-bottom: 1.5rem;
        font-weight: 600;
      }

      .hero-content p {
        color: #636e72;
        margin-bottom: 2rem;
        font-size: 1rem;
      }

      .action-btn {
        display: inline-block;
        background-color: #6c5ce7;
        color: white;
        padding: 12px 30px;
        border-radius: 50px;
        font-weight: bold;
        transition: background 0.3s;
        box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
      }

      .action-btn:hover {
        background-color: #5649c0;
        transform: translateY(-2px);
      }

      /* --- FOOTER --- */
      .footer {
        grid-area: footer;
        background: #fff;
        padding: 2rem;
        border-top: 1px solid #eee;
      }

      .footer ul {
        display: flex;
        justify-content: center;
        gap: 2rem;
        flex-wrap: wrap;
      }

      .footer ul li {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .footer ul li img {
        width: 24px;
        height: 24px;
        filter: grayscale(100%);
        transition: filter 0.3s;
      }

      .footer ul li a {
        color: #b2bec3;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .footer ul li a:hover {
        color: #6c5ce7;
      }

      .footer ul li img:hover {
        filter: grayscale(0%);
      }

      /* --- RESPONSIVE (Desktop) --- */
      @media (min-width: 992px) {
        .container {
          grid-template-areas: 'sidebar content';
          grid-template-columns: 280px 1fr;
          grid-template-rows: 1fr auto;
        }

        .sidebar {
          padding: 3rem 2rem;
          align-items: flex-start;
        }

        .sidebar nav ul {
          flex-direction: column;
          gap: 30px;
        }

        .sidebar nav ul li a {
          font-size: 1.2rem;
        }

        .content {
          padding: 4rem;
        }

        .hero {
          text-align: left;
          padding: 4rem;
          display: flex;
          align-items: center;
          gap: 3rem;
        }

        .hero img {
          margin-bottom: 0;
          width: 220px;
          height: 220px;
          float: left;
        }

        .hero-content {
          flex: 1;
        }

        .hero-content h1 {
          font-size: 3.5rem;
        }

        .hero-content p {
          font-size: 1.1rem;
        }

        .footer {
          padding: 1.5rem 3rem;
        }

        .footer ul {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Sidebar Navigation -->
      <aside class="sidebar">
        <nav>
          <ul>
            <li><a href="#">About</a></li>
            <li><a href="#">Portfolio</a></li>
            <li><a href="#">Blog</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </nav>
      </aside>

      <!-- Main Content Area -->
      <main class="content">
        <section class="hero">
          <!-- Gambar Placeholder (Online User Icon) -->
          <img src="https://cdn-icons-png.flaticon.com/512/7067/7067237.png" alt="Profile Picture" />
          
          <div class="hero-content">
            <h1>Hai, Saya Freelancer</h1>
            <h2>Junior Content Writer at Dicoding</h2>
            <p>
              Saya Abiel Deffa Aretyo pelajar SMKN 15 Jakarta Jurusan RPL。
              Ini adalah deskripsi singkat tentang diri saya.
            </p>
            <a href="#" class="action-btn">Lihat Profil Saya</a>
          </div>
        </section>
      </main>

      <!-- Footer Social Media -->
      <footer class="footer">
        <ul>
          <li>
            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram" />
            <a href="#">Instagram</a>
          </li>
          <li>
            <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook" />
            <a href="#">Facebook</a>
          </li>
          <li>
            <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter" />
            <a href="#">Twitter</a>
          </li>
          <li>
            <img src="https://cdn-icons-png.flaticon.com/512/906/906334.png" alt="Telegram" />
            <a href="#">Telegram</a>
          </li>
        </ul>
      </footer>
    </div>
  </body>
</html>
